services:
  postgres:
    image: postgres:16-alpine
    container_name: softforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-softforge_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softforge -d softforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: softforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: softforge-worker
    restart: unless-stopped
    command: ["arq", "src.core.queue.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://softforge:softforge_secret@postgres:5432/softforge_db
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
